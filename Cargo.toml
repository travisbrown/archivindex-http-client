[workspace]
members = ["archivindex-http-client", "archivindex-http-client-challenge"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
edition = "2024"
rust-version = "1.88"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/travisbrown/archivindex-http-client"

[workspace.dependencies]
archivindex-http-client = { version = "0.1.0", path = "archivindex-http-client" }
chrono = "0.4"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
data-encoding = "2.11.1"
fluent-uri = "0.4"
h2 = "0.4.19"
http = "1"
http-body-util = "0.1"
rcgen = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "socks",
] }
rustls = "0.23.45"
serde = "1"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2"
tokio = "1"
tokio-rustls = "0.26.5"
url = "2"
webpki-roots = "1"
wreq = { version = "=0.16.1", default-features = false }
wreq-proto = "=0.2.6"
wreq-util = { version = "=0.2.0", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[patch.crates-io]
# Apply the observer fork to both direct and transitive uses of wreq. Consuming workspaces
# enabling wreq must repeat these patches; see README.md. The TLS crates share one revision.
wreq = { git = "https://github.com/travisbrown/wreq", rev = "108701e00f33b40132e78d28abce8b4f6e3a6b19" }
btls = { git = "https://github.com/0x676e67/btls", rev = "9d859deefab0183e2fccf91204c818c8d1805b27" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "9d859deefab0183e2fccf91204c818c8d1805b27" }
tokio-btls = { git = "https://github.com/0x676e67/btls", rev = "9d859deefab0183e2fccf91204c818c8d1805b27" }
