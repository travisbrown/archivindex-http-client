[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Travis Brown <travisrobertbrown@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/travisbrown/archivindex-http-client"

[workspace.dependencies]
chrono = "0.4"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
fluent-uri = "0.4"
http = "1"
http-body-util = "0.1"
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = "0.23.45"
thiserror = "2"
tokio = "1"
url = "2"
webpki-roots = "1"

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
