[package]
name = "archivindex-http-client-challenge"
description = "Recognition and bounded solutions for HTTP interstitial challenges"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/archivindex-http-client-challenge"
keywords = ["http", "client", "challenge", "archive"]
categories = ["web-programming::http-client"]
# The HTTP client dependency is not yet published.
publish = false

[lints]
workspace = true

[dependencies]
archivindex-http-client.workspace = true
data-encoding.workspace = true
http.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
chrono.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
