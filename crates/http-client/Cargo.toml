thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
url.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
criterion.workspace = true
# The TLS tests serve self-signed certificates.
rcgen.workspace = true

[[bench]]
name = "response_capture"
harness = false
