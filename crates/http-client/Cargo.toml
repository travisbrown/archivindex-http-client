[package]
name = "archivindex-http-client"
description = "HTTP clients that capture the request and response messages of each exchange"
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/crate/archivindex-http-client/"
keywords = ["http", "client", "capture", "web", "archive"]
categories = ["web-programming::http-client"]
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
license.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The BoringSSL backend with browser emulation and opt-in HTTP/2. It needs Rust 1.98, a native
# toolchain, and the patches described in README.md.
wreq = ["dep:serde", "dep:wreq", "dep:wreq-proto", "dep:wreq-util", "tokio/macros", "tokio/sync"]

[dependencies]
chrono.workspace = true
fluent-uri.workspace = true
http.workspace = true
http-body-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
# Profile names are looked up through the profile type's `Deserialize` implementation.
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
url.workspace = true
webpki-roots.workspace = true
# Redirected to the observer-enabled fork by the workspace patch; see README.md.
wreq = { workspace = true, optional = true, features = ["tokio-rt", "webpki-roots", "socks"] }
# The finalized-header callback used by wreq itself.
wreq-proto = { workspace = true, optional = true }
wreq-util = { workspace = true, optional = true, features = ["emulation", "emulation-serde"] }

[dev-dependencies]
criterion.workspace = true
# Local TLS HTTP/2 fixtures.
h2.workspace = true
# The TLS tests serve self-signed certificates.
rcgen.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-rustls.workspace = true

[[bench]]
name = "response_capture"
harness = false

[[test]]
name = "wreq_http2"
required-features = ["wreq"]

[[test]]
name = "wreq_loopback"
required-features = ["wreq"]
